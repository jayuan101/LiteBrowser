<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<style>
*{box-sizing:border-box}body{margin:0;background:#17202e;color:#eef3fb;font:13px 'Segoe UI',sans-serif}button,input,select{font:inherit;border:1px solid #43526b;border-radius:6px;background:#253249;color:inherit;padding:6px 10px}button{cursor:pointer}button:hover{background:#354967}.row{display:flex;gap:6px;padding:5px 8px;align-items:center;height:40px}#tabs{overflow-x:auto;flex:1;display:flex;gap:4px}.tab{white-space:nowrap;max-width:180px;overflow:hidden}.active{background:#44658a}#address{flex:1;min-width:100px;background:#0d1624}#notice{height:24px;padding:2px 10px;font-size:11px;color:#b7c9e0;overflow:hidden;white-space:nowrap}#library{height:210px;overflow:auto;padding:8px;display:none}#library button{display:block;margin:4px;width:98%;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#library select{position:sticky;top:0}a{color:inherit}
</style></head><body>
<div class="row"><b>Lite Rust</b><button onclick="send({action:'reopen'})" title="Reopen last closed tab">Reopen tab</button><div id="tabs"></div><button onclick="send({action:'new'})" title="New tab">+</button></div>
<div class="row"><button onclick="send({action:'back'})">Back</button><button onclick="send({action:'forward'})">Forward</button><button onclick="send({action:'reload'})">Reload</button><input id="address" placeholder="Address or search" aria-label="Address or search"><button onclick="go()">Go</button><button onclick="send({action:'bookmark'})">Star</button><button onclick="send({action:'library'})">Library</button><button onclick="send({action:'save'})">Save tabs</button></div>
<div id="notice">Preview: original Shields, password manager, private tabs, extensions, and downloads are not ported.</div>
<div id="library"><select id="kind" onchange="drawLibrary()"><option>Bookmarks</option><option>History</option></select><input id="librarySearch" aria-label="Search bookmarks and history" placeholder="Search titles or URLs" oninput="drawLibrary()"><div id="entries"></div></div>
<script>
const send=x=>window.ipc.postMessage(JSON.stringify(x));let state={};
function go(){send({action:'navigate',value:document.getElementById('address').value})}
document.getElementById('address').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
function drawLibrary(){const box=document.getElementById('entries');box.replaceChildren();for(const p of (document.getElementById('kind').value==='Bookmarks'?state.bookmarks:state.history)||[]){const query=document.getElementById('librarySearch').value.toLowerCase();if(!(p.title+' '+p.url).toLowerCase().includes(query))continue;const b=document.createElement('button');b.textContent=p.title+' — '+p.url;b.title=p.url;b.onclick=()=>send({action:'navigate',value:p.url});box.append(b)}}
window.render=s=>{state=s;const tabs=document.getElementById('tabs');tabs.replaceChildren();for(const t of s.tabs){const wrap=document.createElement('span');const b=document.createElement('button');b.className='tab'+(t.id===s.active?' active':'');b.textContent=t.title||'New tab';b.title=t.url;b.onclick=()=>send({action:'select',id:t.id});const close=document.createElement('button');close.textContent='×';close.title='Close tab';close.onclick=()=>send({action:'close',id:t.id});wrap.append(b,close);tabs.append(wrap)}const a=document.getElementById('address');if(document.activeElement!==a)a.value=s.url==='about:blank'?'':s.url;document.getElementById('notice').textContent=s.status;document.getElementById('library').style.display=s.library?'block':'none';drawLibrary()};
send({action:'ready'});
</script></body></html>
