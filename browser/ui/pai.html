<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #16181d; --card: #20232a; --line: #2c3038; --text: #eceef2; --dim: #9aa0ab; --accent: #7c5cff; --err: #ff7b7b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; border-left: 1px solid var(--line); }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  header .name { font-weight: 600; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.ok { background: #3ecf8e; } .dot.bad { background: var(--err); }
  #status { color: var(--dim); font-size: 12px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 7px;
           padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.icon { padding: 3px 8px; font-size: 15px; line-height: 1; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 8px 10px; border-radius: 9px; max-width: 100%; overflow-wrap: anywhere; }
  .msg.you { background: #2b2740; align-self: flex-end; white-space: pre-wrap; }
  .msg.pai { background: var(--card); }
  .msg.note { color: var(--dim); font-size: 12px; padding: 0 2px; }
  .msg.err { color: var(--err); font-size: 12px; padding: 0 2px; }
  .msg .about { display: block; color: var(--dim); font-size: 11px; margin-bottom: 3px; white-space: normal; }
  .msg code { background: #0f1115; padding: 1px 4px; border-radius: 4px; font-family: Consolas, monospace; }
  .msg pre { background: #0f1115; padding: 8px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
  .msg p { margin: 0 0 6px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 0 0 6px; padding-left: 18px; }
  .empty { color: var(--dim); text-align: center; margin: auto 10px; font-size: 12.5px; }
  footer { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  #pageline { color: var(--dim); font-size: 11.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row { display: flex; gap: 6px; }
  textarea { flex: 1; resize: none; height: 58px; background: var(--card); color: var(--text);
             border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; outline: none; }
  textarea:focus { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span><span class="name">PAI</span>
  <span id="status">Checking…</span>
  <button class="icon" id="new" title="New chat">＋</button>
  <button class="icon" id="close" title="Close the PAI panel (Ctrl+Shift+A)">✕</button>
</header>
<div id="log"><div class="empty" id="empty">Ask PAI anything, or ask about the page you're on.<br><br>
  Your chats here are saved in PAI like any other.</div></div>
<footer>
  <div id="pageline">No page to share</div>
  <div class="row">
    <button id="summarize" disabled>Summarize this page</button>
    <button id="askpage" disabled title="Send your question with this page">Ask about this page</button>
  </div>
  <div class="row">
    <textarea id="input" placeholder="Message PAI (Enter to send, Shift+Enter for a new line)"></textarea>
  </div>
  <div class="row" style="justify-content: flex-end">
    <button id="stop" style="display:none">Stop</button>
    <button class="primary" id="send">Send</button>
  </div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const post = (msg) => window.chrome.webview.postMessage(msg);
let busy = false, current = null, pageOk = false;

function esc(s) { return s.replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
function inline(s) {
  return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}
function render(md) {
  // Small Markdown: code fences, bullets, paragraphs, **bold**, `code`. Escaped first.
  const out = [], parts = esc(md).split(/```[a-z]*\n?/);
  parts.forEach((part, i) => {
    if (i % 2) { out.push('<pre>' + part + '</pre>'); return; }
    part.split(/\n{2,}/).forEach((block) => {
      const lines = block.split('\n').filter((l) => l.trim());
      if (!lines.length) return;
      if (lines.every((l) => /^\s*([-*•]|\d+\.)\s/.test(l))) {
        out.push('<ul>' + lines.map((l) => '<li>' + inline(l.replace(/^\s*([-*•]|\d+\.)\s/, '')) + '</li>').join('') + '</ul>');
      } else {
        out.push('<p>' + inline(lines.join('<br>')) + '</p>');
      }
    });
  });
  return out.join('');
}
function add(cls, html) {
  $('empty') && $('empty').remove();
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.innerHTML = html;
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
  return el;
}
function setBusy(b) {
  busy = b;
  $('send').disabled = b;
  $('stop').style.display = b ? '' : 'none';
  $('summarize').disabled = $('askpage').disabled = b || !pageOk;
}
function send(withPage, text) {
  if (busy) return;
  text = (text ?? $('input').value).trim();
  if (!text && !withPage) return;
  $('input').value = '';
  post({pai: 'send', text, page: withPage});
}
$('send').onclick = () => send(false);
$('askpage').onclick = () => send(true);
$('summarize').onclick = () => send(true, 'Summarize this page for me.');
$('stop').onclick = () => post({pai: 'stop'});
$('new').onclick = () => { post({pai: 'new'}); $('log').innerHTML = ''; };
$('close').onclick = () => post({pai: 'close'});
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(false); }
  else if (e.key === 'Escape') post({pai: 'close'});
});
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') { e.preventDefault(); post({pai: 'close'}); }
});

window.chrome.webview.addEventListener('message', (e) => {
  const d = e.data;
  if (d.health) {
    $('dot').className = 'dot ' + (d.health.ok ? 'ok' : 'bad');
    $('status').textContent = d.health.text;
  }
  if (d.page) {
    pageOk = !!d.page.ok;
    $('pageline').textContent = d.page.ok ? 'This page: ' + d.page.title : d.page.why;
    $('pageline').title = $('pageline').textContent;
    setBusy(busy);
  }
  if (d.you) add('you', (d.you.about ? '<span class="about">about: ' + esc(d.you.about) + '</span>' : '') + esc(d.you.text));
  if (d.start) { current = {el: add('pai', '<span style="color:var(--dim)">…</span>'), text: ''}; setBusy(true); }
  if (d.status && current && !current.text) current.el.innerHTML = '<span style="color:var(--dim)">' + esc(d.status) + '</span>';
  if (d.token && current) {
    current.text += d.token;
    current.el.innerHTML = render(current.text);
    $('log').scrollTop = $('log').scrollHeight;
  }
  if (d.note) add('note', esc(d.note));
  if (d.error) { if (current && !current.text) current.el.remove(); add('err', esc(d.error)); }
  if (d.done) {
    if (current && !current.text) current.el.innerHTML = '<span style="color:var(--dim)">(no answer)</span>';
    current = null; setBusy(false);
  }
  if (d.focus) $('input').focus();
});
post({pai: 'ready'});
</script>
</body>
</html>
